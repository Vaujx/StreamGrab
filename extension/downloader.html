<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="common.js"></script><link rel="stylesheet" href="ui.css"><title>StreamGrab</title></head>
<body>
<div class="shell wide">
  <header class="topbar"><a class="brand" href="#"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></span>StreamGrab</a><div class="tools"><button class="icon-btn" data-theme-toggle aria-label="Switch light or dark theme"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button><a class="icon-btn" href="settings.html" target="_blank" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a></div></header>
  <div class="layout" id="layout">
  <aside class="frame-col" id="frameCol">
    <figure class="frame" id="frame" data-fit="cover">
      <button class="frame-add" id="frameAdd" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>
        <span>Add a picture or GIF</span>
      </button>
      <img id="frameImg" alt="" hidden>
      <div class="frame-ctl" id="frameCtl" hidden>
        <button class="btn" id="frameChange" type="button">Change</button>
        <button class="btn" id="frameRemove" type="button">Remove</button>
      </div>
    </figure>
    <div class="frame-msg" id="frameMsg" role="status"></div>
  </aside>
  <main>
    <h1 id="title">Save media</h1>
    <p class="url" id="src"></p>
    <div class="notice" id="notice" hidden>Please read and accept the <a href="terms.html">terms</a> before your first download.</div>
    <section class="panel">
      <div class="field"><label for="name">File name</label><input type="text" id="name"></div>
      <div class="row3">
        <div class="field"><label for="quality">Quality</label><select id="quality" disabled><option>Loading…</option></select></div>
        <div class="field"><label for="threads">Threads</label><select id="threads"><option>1</option><option>2</option><option>4</option><option>8</option><option>16</option></select></div>
        <div class="field"><label for="fmt">Output</label><select id="fmt"><option value="mp4">MP4</option><option value="ts">Raw .ts</option></select></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="start" disabled>Start download</button>
        <button class="btn" id="stop" disabled>Stop &amp; save</button>
      </div>
    </section>
    <section class="stage" id="stage" data-state="idle">
      <div class="anim" id="anim">
        <svg class="idle-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
        <svg class="done-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>
        <span class="spin"></span>
        <img class="custom" alt="">
      </div>
      <div class="meter">
        <div id="status">Reading playlist…</div>
        <div class="bar"><div id="fill"></div></div>
        <div class="stats"><span id="prog"></span><span id="speed"></span></div>
      </div>
    </section>
    <nav class="foot"><a href="settings.html">Settings</a><a href="terms.html">Terms</a></nav>
  </main>
</div>
</div>
<script src="lib/mux.min.js"></script>
<script src="downloader.js"></script>
</body></html>
